version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careerlens_postgres
    environment:
      POSTGRES_USER: careerlens
      POSTGRES_PASSWORD: careerlens_secret
      POSTGRES_DB: careerlens_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerlens -d careerlens_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careerlens_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
